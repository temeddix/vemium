[project]
name = "vemium-room-workspace"
version = "0.0.0"
description = "Per-room debate workspace; agents extend this file as needed."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "ty>=0.0.1a4",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6",
  "ty>=0.0.1a4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
