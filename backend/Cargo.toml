[package]
name = "vemium_backend"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chromiumoxide = { version = "0.9", features = ["fetcher", "rustls", "zip0"] }
chromiumoxide_fetcher = { version = "0.9", default-features = false, features = ["zip0", "rustls"] }
cron = "0.12"
futures = "0.3"
rand = "0.8"
kreuzberg = { version = "4.9", default-features = false, features = [
    "pdf",
    "excel",
    "office",
    "email",
    "html",
    "xml",
    "archives",
    "hwp",
    "iwork",
    "mdx",
    "ocr",
    "tokio-runtime",
    "simd-utf8",
    "auto-rotate",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
rig-core = { version = "0.36" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
