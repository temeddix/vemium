services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      DATABASE_URL: sqlite:///data/vemium.db
    ports:
      - "${PORT}:8080"
    volumes:
      - vemium-data:/data

volumes:
  vemium-data:
