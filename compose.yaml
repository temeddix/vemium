services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${PORT}:8080"
    volumes:
      - vemium-data:/data
    restart: unless-stopped
    depends_on:
      playwright:
        condition: service_started

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    command:
      - --port
      - "8931"
      - --host
      - 0.0.0.0
    init: true
    restart: unless-stopped
    shm_size: 1g

volumes:
  vemium-data:
