services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${PORT}:8080"
    volumes:
      - vemium-data:/data
    restart: unless-stopped
    depends_on:
      playwright:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    command:
      - --port
      - "8931"
      - --host
      - 0.0.0.0
    init: true
    restart: unless-stopped
    shm_size: 1g
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8931"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  vemium-data:
